<body>

<div class="app" id="app"></div>

<script>
/* =========================================================
   1. ПАРСЕР (портирован из schedule_parser.py)
   ========================================================= */
const DAYS = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница'];
const CLASS_LETTERS = 'абвгдежзиклмнопрстуфхцчшщъыьэюя';

function createScheduleData() {
  return { teachers: {}, classes: {}, rooms: {}, subjects: {} };
}
function cell(row, idx) {
  const v = row[idx];
  if (v === undefined || v === null) return '';
  return String(v).trim();
}
function cleanValue(value) {
  if (value === undefined || value === null || value === '') return '';
  let cleaned = String(value).trim().replace(/"/g, '');
  // убираем случайные одиночные кавычки/апострофы по краям значения —
  // такие артефакты копипаста встречаются в исходном файле, например «Лит-ра'»
  cleaned = cleaned.replace(/^[''`\u2018\u2019]+|[''`\u2018\u2019]+$/g, '').trim();
  return cleaned === 'nan' ? '' : cleaned;
}
function extractClassName(rawValue) {
  const value = cleanValue(rawValue);
  if (!value) return null;
  const re = new RegExp('^\\d+[' + CLASS_LETTERS + ']$', 'i');
  return re.test(value) ? value : null;
}
function isDaysHeader(row) {
  // раньше проверялось только, что в первой колонке дня стоит «понедельник»/«вторник» —
  // это ломалось на неполных неделях (например, когда выложили только среду и четверг).
  // теперь ищем любое известное название дня в любой из колонок-заголовков дней.
  return Object.keys(mapDayColumns(row)).length > 0;
}
function mapDayColumns(row) {
  // важно: subject/room берутся из ТОЙ ЖЕ колонки, где реально найдено название дня,
  // а не пересчитываются по порядковому номеру среди найденных дней. Это защищает от
  // ситуации, когда в файле неполной недели пустые колонки понедельника/вторника
  // physически остаются в таблице (а не удаляются) — иначе данные читались бы не из тех колонок.
  const dayMap = {};
  const maxCol = Math.min(12, row.length);
  for (let colIdx = 1; colIdx < maxCol; colIdx += 2) {
    const dayName = cell(row, colIdx).toLowerCase();
    if (DAYS.includes(dayName)) {
      dayMap[dayName] = { subject: colIdx, room: colIdx + 1 };
    }
  }
  return dayMap;
}
function extractLessonNumber(rawValue) {
  const value = cleanValue(rawValue);
  if (!value) return null;
  const num = parseInt(parseFloat(value), 10);
  if (Number.isNaN(num)) return null;
  return (num >= 1 && num <= 10) ? num : null;
}
/* ---------- Нормализация названий предметов ----------
   Один и тот же предмет в исходном файле часто записан по-разному:
   «Геометрия» / «Геометр.» / опечатки вроде «Геметр.». Чтобы такие
   записи не расходились по разным карточкам, приводим их к единому
   каноническому названию через subjectKey() — ключ без пробелов, точек
   и без учёта регистра. Благодаря этому, например, «Рус. яз.» и
   «Рус.яз.» совпадают автоматически, даже без явной записи в словаре;
   в словарь попадают только реальные сокращения/опечатки/короткие формы. */
const SUBJECT_CANON = {
  'русяз': 'Русский язык', 'русз': 'Русский язык', 'рус': 'Русский язык',
  'русскийязык': 'Русский язык', 'русский': 'Русский язык',
  'англяз': 'Английский язык', 'англ': 'Английский язык',
  'английский': 'Английский язык', 'английскийязык': 'Английский язык',
  'китяз': 'Китайский язык', 'кит': 'Китайский язык',
  'китайский': 'Китайский язык', 'китайскийязык': 'Китайский язык',
  'матем': 'Математика', 'мат': 'Математика', 'математика': 'Математика',
  'алгебра': 'Алгебра',
  'геометр': 'Геометрия', 'геметр': 'Геометрия', 'геометрия': 'Геометрия',
  'физика': 'Физика',
  'биолог': 'Биология', 'биол': 'Биология', 'биология': 'Биология',
  'географ': 'География', 'геогр': 'География', 'география': 'География',
  'история': 'История',
  'истспб': 'История СПб', 'историяспб': 'История СПб',
  'лит-ра': 'Литература', 'литра': 'Литература', 'литература': 'Литература',
  'инф-ка': 'Информатика', 'инф': 'Информатика', 'информатика': 'Информатика',
  'общ-ние': 'Обществознание', 'общ': 'Обществознание', 'обществознание': 'Обществознание',
  'химия': 'Химия', 'хим': 'Химия',
  'чтение': 'Чтение', 'чтене': 'Чтение',
  'изо': 'ИЗО',
  'окрмир': 'Окружающий мир', 'окружающиймир': 'Окружающий мир',
  'физ-ра': 'Физкультура', 'физра': 'Физкультура', 'физкультура': 'Физкультура',
  'плав-е': 'Плавание', 'плавание': 'Плавание',
};
function subjectKey(base) {
  return base.toLowerCase().replace(/\s+/g, '').replace(/\.+/g, '');
}
function normalizeSubject(rawValue) {
  const value = cleanValue(rawValue);
  if (!value) return value;
  // факультатив/элективный курс помечается «(Э)» — переносим пометку отдельно,
  // чтобы «Общ(Э)» и «Общ-ние» находили один и тот же предмет в словаре
  const electiveMatch = value.match(/\(\s*э\s*\)/i);
  const base = electiveMatch ? value.slice(0, electiveMatch.index).trim() : value;
  if (!base) return value;
  const canonical = SUBJECT_CANON[subjectKey(base)];
  return (canonical || base) + (electiveMatch ? ' (Э)' : '');
}

/* ---------- Определение «это учитель», а не «это предмет» ----------
   Раньше это делалось по вручную собранному списку сокращений предметов
   (NON_TEACHERS) — каждый новый вариант сокращения приходилось добавлять
   туда отдельно, и именно рассинхронизация с реальными сокращениями и
   приводила к путанице учитель/предмет. Теперь список известных
   предметов один — SUBJECT_CANON, тот же, что убирает дубли предметов,
   а учитель распознаётся по формату ФИО «Фамилия И.О.», а не по
   исключению из списка. */
const TEACHER_NAME_RE = /^[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ]\.\s*[А-ЯЁ]?\.?$/;
const TEACHER_FULLNAME_RE = /^[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+$/;
const VACANCY_RE = /^вакан/i;

function isKnownSubjectText(text) {
  const electiveMatch = text.match(/\(\s*э\s*\)/i);
  const base = electiveMatch ? text.slice(0, electiveMatch.index).trim() : text;
  if (!base) return false;
  return Object.prototype.hasOwnProperty.call(SUBJECT_CANON, subjectKey(base));
}
function isVacancy(text) {
  return VACANCY_RE.test(text);
}
function isTeacherName(text) {
  if (!text) return false;
  text = cleanValue(text);
  if (!text) return false;
  if (isVacancy(text)) return true; // «Вакансия» стоит на месте учителя — это не предмет
  if (isKnownSubjectText(text)) return false; // это точно известный предмет, а не ФИО
  if (TEACHER_NAME_RE.test(text)) return true;
  if (TEACHER_FULLNAME_RE.test(text)) return true;
  return false;
}
function extractLessonsFromBlock(lessonRows, subjectCol, roomCol) {
  if (!lessonRows.length) return [];
  // Раньше «главной» всегда считалась первая физическая строка блока —
  // это ломалось, когда для конкретного дня реальные данные начинались
  // не с неё: например, в блоке с потоковым делением на несколько
  // преподавателей у одного дня (скажем, четверга) строк больше, чем у
  // другого (среды), и если среда «короче» и её данные из-за этого
  // смещены на вторую строку блока — прежняя логика решала, что у среды
  // на этом уроке вообще нет данных, и создавала лишнее «Окно». Такое же
  // смещение возникает и в файлах с неполной неделей. Поэтому теперь для
  // КАЖДОГО дня ищем первую строку именно с его собственными данными.
  let anchorIdx = -1;
  for (let i = 0; i < lessonRows.length; i++) {
    if (cleanValue(cell(lessonRows[i], subjectCol))) { anchorIdx = i; break; }
  }
  if (anchorIdx === -1) return [];

  const mainSubject = cleanValue(cell(lessonRows[anchorIdx], subjectCol));
  const mainRoom = cleanValue(cell(lessonRows[anchorIdx], roomCol));

  const subjectVariants = [[mainSubject, mainRoom]];
  const teachers = [];
  for (let i = anchorIdx + 1; i < lessonRows.length; i++) {
    const row = lessonRows[i];
    const subjectValue = cleanValue(cell(row, subjectCol));
    const roomValue = cleanValue(cell(row, roomCol));
    if (subjectValue && !isTeacherName(subjectValue)) {
      if (normalizeSubject(subjectValue) === normalizeSubject(mainSubject)) {
        subjectVariants.push([subjectValue, roomValue]);
      }
    } else if (subjectValue && isTeacherName(subjectValue)) {
      teachers.push([subjectValue, roomValue]);
    }
  }
  if (!teachers.length) return [[mainSubject, mainRoom ? [mainRoom] : [], []]];

  const resultLessons = [];
  if (subjectVariants.length > 1) {
    for (let i = 0; i < subjectVariants.length; i++) {
      const [subject, room] = subjectVariants[i];
      if (i < teachers.length) {
        const [teacher, teacherRoom] = teachers[i];
        resultLessons.push([subject, [teacherRoom || room], [teacher]]);
      }
    }
    if (teachers.length > subjectVariants.length) {
      const lastRoom = subjectVariants.length ? subjectVariants[subjectVariants.length - 1][1] : mainRoom;
      for (let i = subjectVariants.length; i < teachers.length; i++) {
        const [teacher, teacherRoom] = teachers[i];
        resultLessons.push([mainSubject, [teacherRoom || lastRoom], [teacher]]);
      }
    }
  } else {
    let rooms = mainRoom ? [mainRoom] : [];
    for (const [, teacherRoom] of teachers) {
      if (teacherRoom && !rooms.includes(teacherRoom)) rooms.push(teacherRoom);
    }
    if (!rooms.length && mainRoom) rooms = [mainRoom];
    for (let i = 0; i < teachers.length; i++) {
      const [teacher, teacherRoom] = teachers[i];
      let roomToUse;
      if (teacherRoom) roomToUse = teacherRoom;
      else if (i < rooms.length) roomToUse = rooms[i];
      else roomToUse = rooms.length ? rooms[rooms.length - 1] : '';
      resultLessons.push([mainSubject, [roomToUse], [teacher]]);
    }
  }
  return resultLessons;
}
/* Если ячейка с номером урока объединена на несколько строк (типичная
   разметка потоковых уроков), возвращает последнюю строку этого
   объединения (0-индексация, как в SheetJS !merges). Если объединения
   нет — возвращает саму rowIndex (блок из одной строки, как раньше). */
function mergedRowSpanEnd(merges, colIndex, rowIndex) {
  if (!merges) return rowIndex;
  for (const m of merges) {
    if (m.s.c === colIndex && m.e.c === colIndex && m.s.r === rowIndex) {
      return m.e.r;
    }
  }
  return rowIndex;
}
function processLessonBlock(rows, startRow, className, lessonNum, dayColumns, scheduleData, merges) {
  const lessonRows = [rows[startRow] || []];
  let currentRow = startRow + 1;
  // Учитель часто стоит не сразу под предметом, а через одну-две полностью
  // пустые строки-«распорки» (визуальное оформление внутри объединённой
  // ячейки номера урока). Такие строки нельзя считать концом блока, пока
  // мы не вышли за пределы объединения номера урока — иначе учитель на
  // следующей строке молча теряется, а весь урок пропадает как «Окно».
  const mergedEnd = mergedRowSpanEnd(merges, 0, startRow);
  while (currentRow < rows.length) {
    const row = rows[currentRow] || [];
    if (extractClassName(cell(row, 0)) || extractLessonNumber(cell(row, 0)) !== null) break;
    const allEmpty = row.length === 0 || row.every(c => cleanValue(c) === '');
    if (allEmpty && currentRow > mergedEnd) break;
    lessonRows.push(row);
    currentRow++;
  }
  for (const [day, cols] of Object.entries(dayColumns)) {
    const lessonsForDay = extractLessonsFromBlock(lessonRows, cols.subject, cols.room);
    for (const [subject, rooms, teachers] of lessonsForDay) {
      if (!subject) continue;
      const canonicalSubject = normalizeSubject(subject);
      // Если учителя не нашлось совсем — всё равно показываем сам урок
      // (с пометкой «не указан»), а не молча теряем его целиком.
      const teacherList = teachers.length ? teachers : [''];
      teacherList.forEach((teacher, i) => {
        const teacherRoom = i < rooms.length ? rooms[i] : (rooms.length ? rooms[0] : '');
        const lessonData = { subject: canonicalSubject, room: teacherRoom, teacher, class: className, lesson_num: lessonNum, day };
        if (!scheduleData.classes[className][day][lessonNum]) scheduleData.classes[className][day][lessonNum] = [];
        scheduleData.classes[className][day][lessonNum].push(lessonData);
      });
    }
  }
}
function findNextLessonRow(rows, startRow) {
  for (let i = startRow; i < rows.length; i++) {
    const row = rows[i] || [];
    if (extractLessonNumber(cell(row, 0)) !== null) return i;
    if (extractClassName(cell(row, 0))) return i;
  }
  return rows.length;
}
function buildSecondaryStructures(scheduleData) {
  for (const classData of Object.values(scheduleData.classes)) {
    for (const lessons of Object.values(classData)) {
      for (const lessonList of Object.values(lessons)) {
        for (const lesson of lessonList) {
          if (lesson.teacher) (scheduleData.teachers[lesson.teacher] ??= []).push(lesson);
          if (lesson.room) (scheduleData.rooms[lesson.room] ??= []).push(lesson);
          if (lesson.subject) (scheduleData.subjects[lesson.subject] ??= []).push(lesson);
        }
      }
    }
  }
}
function parseRows(rows, merges) {
  const scheduleData = createScheduleData();
  let currentClass = null;
  let dayColumns = {};
  let rowIdx = 0;
  while (rowIdx < rows.length) {
    const row = rows[rowIdx] || [];
    const className = extractClassName(cell(row, 0));
    if (className) {
      currentClass = className;
      scheduleData.classes[currentClass] = {};
      DAYS.forEach(d => { scheduleData.classes[currentClass][d] = {}; });
      rowIdx++; continue;
    }
    if (isDaysHeader(row)) { dayColumns = mapDayColumns(row); rowIdx++; continue; }
    const lessonNum = extractLessonNumber(cell(row, 0));
    if (lessonNum !== null && currentClass && Object.keys(dayColumns).length) {
      processLessonBlock(rows, rowIdx, currentClass, lessonNum, dayColumns, scheduleData, merges);
      rowIdx = findNextLessonRow(rows, rowIdx + 1);
    } else { rowIdx++; }
  }
  buildSecondaryStructures(scheduleData);
  return scheduleData;
}

/* =========================================================
   1б. ПАРСЕР ФОРМАТА «ПЕДАГОГИ»
   ========================================================= */
/* В этом формате роли полей зеркально меняются по сравнению с форматом
   «Классы»: блок озаглавлен ФИО педагога (а не классом), и в ячейке,
   где раньше был просто предмет, теперь склеены класс и предмет через
   дефис — например «9а-Труд», «8д-Инф-ка» (дефис внутри самого предмета,
   как в «Инф-ка», не мешает — класс всегда отделяется по ПЕРВОМУ дефису).
   Учитель в этом формате не пишется в каждой строке отдельно — он один
   и тот же для всего блока, поэтому отдельного распознавания
   учитель/предмет здесь не требуется. Нормализация названий предметов
   (SUBJECT_CANON/normalizeSubject) используется точно так же, как и в
   формате «Классы» — проблема разных сокращений одна и та же в обоих
   форматах. */
function isSoleCellHeader(row) {
  const v = cleanValue(cell(row, 0));
  if (!v) return false;
  if (extractLessonNumber(v) !== null) return false;
  if (isDaysHeader(row)) return false;
  for (let i = 1; i < row.length; i++) {
    if (cleanValue(cell(row, i)) !== '') return false;
  }
  return true;
}
function parseClassSubject(rawValue) {
  const value = cleanValue(rawValue);
  if (!value) return null;
  const idx = value.indexOf('-');
  if (idx <= 0) return null; // нет дефиса-разделителя, либо класс пустой — не наш формат ячейки
  const classPart = value.slice(0, idx).trim();
  const subjectPart = value.slice(idx + 1).trim();
  if (!classPart || !subjectPart) return null;
  return { class: classPart, subject: subjectPart };
}
function findNextTeacherBlockRow(rows, startRow) {
  for (let i = startRow; i < rows.length; i++) {
    const row = rows[i] || [];
    if (extractLessonNumber(cell(row, 0)) !== null) return i;
    if (isSoleCellHeader(row)) return i;
  }
  return rows.length;
}
function ensureClassEntry(scheduleData, className) {
  if (!scheduleData.classes[className]) {
    scheduleData.classes[className] = {};
    DAYS.forEach(d => { scheduleData.classes[className][d] = {}; });
  }
}
function processTeacherLessonBlock(rows, startRow, teacherName, lessonNum, dayColumns, scheduleData, merges) {
  const lessonRows = [rows[startRow] || []];
  let currentRow = startRow + 1;
  const mergedEnd = mergedRowSpanEnd(merges, 0, startRow);
  while (currentRow < rows.length) {
    const row = rows[currentRow] || [];
    if (isSoleCellHeader(row) || extractLessonNumber(cell(row, 0)) !== null) break;
    const allEmpty = row.length === 0 || row.every(c => cleanValue(c) === '');
    if (allEmpty && currentRow > mergedEnd) break;
    lessonRows.push(row); // строки-продолжения — параллельные группы у того же педагога в это же время
    currentRow++;
  }
  for (const [day, cols] of Object.entries(dayColumns)) {
    for (const row of lessonRows) {
      const raw = cell(row, cols.subject);
      const parsed = parseClassSubject(raw);
      if (!parsed) continue;
      const room = cleanValue(cell(row, cols.room));
      const className = parsed.class;
      const subject = normalizeSubject(parsed.subject);
      ensureClassEntry(scheduleData, className);
      const lessonData = { subject, room, teacher: teacherName, class: className, lesson_num: lessonNum, day };
      if (!scheduleData.classes[className][day][lessonNum]) scheduleData.classes[className][day][lessonNum] = [];
      scheduleData.classes[className][day][lessonNum].push(lessonData);
    }
  }
}
function parseTeacherRows(rows, merges) {
  const scheduleData = createScheduleData();
  let currentTeacher = null;
  let dayColumns = {};
  let rowIdx = 0;
  while (rowIdx < rows.length) {
    const row = rows[rowIdx] || [];
    if (isSoleCellHeader(row)) {
      currentTeacher = cleanValue(cell(row, 0));
      rowIdx++; continue;
    }
    if (isDaysHeader(row)) { dayColumns = mapDayColumns(row); rowIdx++; continue; }
    const lessonNum = extractLessonNumber(cell(row, 0));
    if (lessonNum !== null && currentTeacher && Object.keys(dayColumns).length) {
      processTeacherLessonBlock(rows, rowIdx, currentTeacher, lessonNum, dayColumns, scheduleData, merges);
      rowIdx = findNextTeacherBlockRow(rows, rowIdx + 1);
    } else { rowIdx++; }
  }
  buildSecondaryStructures(scheduleData);
  return scheduleData;
}

/* ---------- Автоопределение формата файла ----------
   Заголовок самого первого блока в файле — это либо название класса
   («1а», «9б» — формат «Классы»), либо ФИО педагога (формат «Педагоги»).
   По этому единственному признаку выбирается нужный парсер. */
function detectScheduleFormat(rows) {
  for (const row of rows) {
    if (isDaysHeader(row)) break; // дошли до первого блока, не встретив заголовок — формат не определить
    const v = cleanValue(cell(row, 0));
    if (!v) continue;
    return extractClassName(v) ? 'classes' : 'teachers';
  }
  return 'classes';
}
function parseSchedule(rows, merges) {
  return detectScheduleFormat(rows) === 'teachers' ? parseTeacherRows(rows, merges) : parseRows(rows, merges);
}

/* =========================================================
   2. СОСТОЯНИЕ + УТИЛИТЫ
   ========================================================= */
let scheduleData = createScheduleData();
let currentFileName = '';
const app = document.getElementById('app');
const dayOrder = DAYS;
const APP_NAME = 'Расписание547';
let APP_VERSION = '1.6.0'; // запасное значение на случай, если sw.js не удастся прочитать (например, файл открыт как file://)
const APP_AUTHOR = 'Вощиков Л.Д.';
const APP_SCHOOL = 'ГБОУ СОШ №547 Красносельского района Санкт-Петербурга';
const LESSON_TIMES = {
  1: '08:30-09:10', 2: '09:20-10:00', 3: '10:20-11:00', 4: '11:20-12:00', 5: '12:10-12:50',
  6: '13:10-13:50', 7: '14:10-14:50', 8: '15:10-15:50', 9: '16:10-16:50', 10: '17:10-17:50'
};
const timeText = num => LESSON_TIMES[num] || '';

/* ---------- Подсветка текущего/следующего урока ----------
   Ориентируется на системные часы устройства — браузер не умеет отдельно
   спрашивать «настоящее сетевое время», у него есть доступ только к
   часам самого устройства (Date). На практике телефоны и компьютеры почти
   всегда сами синхронизируют часы по сети, так что для этой задачи
   разницы нет. */
function getTodayDayName() {
  const idx = new Date().getDay(); // 0=вс,1=пн,...,6=сб
  const map = { 1: 'понедельник', 2: 'вторник', 3: 'среда', 4: 'четверг', 5: 'пятница' };
  return map[idx] || null; // на выходных подсвечивать нечего
}
function timeRangeToMinutes(rangeStr) {
  const [startStr, endStr] = rangeStr.split('-');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  return { start: toMin(startStr), end: toMin(endStr) };
}
function getCurrentAndNextLesson() {
  const today = getTodayDayName();
  if (!today) return { today: null, current: null, next: null };
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nums = Object.keys(LESSON_TIMES).map(Number).sort((a, b) => a - b);
  let current = null, next = null;
  for (const n of nums) {
    const { start, end } = timeRangeToMinutes(LESSON_TIMES[n]);
    if (nowMin >= start && nowMin < end) { current = n; break; }
  }
  if (current === null) {
    for (const n of nums) {
      const { start } = timeRangeToMinutes(LESSON_TIMES[n]);
      if (nowMin < start) { next = n; break; }
    }
  }
  return { today, current, next };
}
/* Снимает прошлую подсветку и расставляет новую по всем видимым карточкам
   уроков сразу на всех вкладках (Учителя/Классы/Кабинеты) — вызывается и
   после каждой перерисовки расписания, и по таймеру (см. bootApp), чтобы
   подсветка сама переезжала на следующий урок без перезагрузки страницы. */
function applyTimeHighlight() {
  document.querySelectorAll('.slot-current, .slot-next').forEach(el => {
    el.classList.remove('slot-current', 'slot-next');
  });
  const { today, current, next } = getCurrentAndNextLesson();
  if (!today) return;
  if (current !== null) {
    document.querySelectorAll(`.slot[data-day="${today}"][data-lesson="${current}"]`).forEach(el => el.classList.add('slot-current'));
  } else if (next !== null) {
    document.querySelectorAll(`.slot[data-day="${today}"][data-lesson="${next}"]`).forEach(el => el.classList.add('slot-next'));
  }
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------- Светлая/тёмная тема ---------- */
/* Хранится в localStorage (крошечное значение, как и избранное) и не
   зависит от версии кэша — переживает обновления приложения. Применяется
   через класс theme-dark на <body>, все цвета — CSS-переменные, поэтому
   переключение не требует ничего перерисовывать. */
const THEME_KEY = 'raspisanie547-theme';
function getTheme() {
  try { return localStorage.getItem(THEME_KEY) || 'light'; }
  catch (err) { return 'light'; }
}
function applyTheme(theme) {
  document.body.classList.toggle('theme-dark', theme === 'dark');
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    btn.textContent = theme === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема';
  });
}
function setTheme(theme) {
  try { localStorage.setItem(THEME_KEY, theme); }
  catch (err) { console.warn('Не удалось сохранить тему:', err); }
  applyTheme(theme);
}
function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}
function themeToggleButtonHtml() {
  const label = getTheme() === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема';
  return `<button class="btn secondary theme-toggle" type="button">${label}</button>`;
}

/* Оборачивает имя учителя/класса/кабинета в кликабельную ссылку — клик по
   ней переключает на соответствующую вкладку и сразу открывает расписание
   этого элемента (см. goTo() и делегированный обработчик кликов ниже).
   Служебные значения вроде «не указан» или «?» ссылками не делаем. */
function xlink(type, name, label) {
  const text = label !== undefined ? label : name;
  if (!name || name === '?' || name === 'не указан') return esc(text);
  return `<span class="xlink" data-type="${esc(type)}" data-name="${esc(name)}">${esc(text)}</span>`;
}

/* Номер версии приложения теперь хранится в одном месте — в CACHE_VERSION
   внутри sw.js. Здесь мы просто читаем этот файл как обычный текст и
   вытаскиваем значение регулярным выражением — благодаря этому не нужно
   отдельно помнить о правке номера версии в самом index.html при каждом
   обновлении: достаточно поменять его один раз в sw.js. Если sw.js
   недоступен (например, файл открыт напрямую с диска, не через сайт) —
   остаётся запасное значение APP_VERSION, заданное выше. */
async function syncAppVersionFromServiceWorker() {
  try {
    const res = await fetch('sw.js', { cache: 'no-store' });
    const text = await res.text();
    const m = text.match(/const\s+CACHE_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if (m) APP_VERSION = m[1];
  } catch (err) {
    // офлайн или файл открыт не через сайт — остаёмся на запасном значении
  }
  document.title = `${APP_NAME} v${APP_VERSION}`;
}

/* =========================================================
   3а-1. АДМИНИСТРАТИВНАЯ ВКЛАДКА (скрытая проверка ошибок расписания)

/* Доступ скрыт намеренно — обычный пользователь не должен на неё
   натыкаться случайно. Открывается одним и тем же жестом что на телефоне,
   что на компьютере: 7 кликов/тапов подряд (в течение 3 секунд) по строке
   «Загружен: …» в шапке приложения. Состояние («открыта» или нет) хранится
   в localStorage, поэтому один раз обнаруженная вкладка остаётся видимой
   и в следующих сессиях — как скрытые «Параметры разработчика» в Android. */
const ADMIN_UNLOCK_KEY = 'raspisanie547-admin-unlocked';
function isAdminUnlocked() {

function setAdminUnlocked(value) {

}
let secretTapCount = 0;

/* Поиск конфликтов в расписании. Работает одинаково для файлов обоих
   форматов («Классы» и «Педагоги»), т.к. к этому моменту оба уже собраны
   в одну и ту же структуру scheduleData — отдельной логики на формат не
   требуется.
   - Конфликт учителя: один и тот же педагог в один день и на один и тот
     же номер урока числится в РАЗНЫХ классах одновременно.
   - Конфликт кабинета: один и тот же кабинет в один день и на один и тот
     же номер урока используется РАЗНЫМИ классами одновременно. Несколько
     параллельных групп ОДНОГО класса в одном кабинете (например, две
     группы физкультуры в одном зале) конфликтом не считаются. */
function findScheduleConflicts() {
  function groupConflicts(entries) {
    const result = [];
    Object.entries(entries).forEach(([who, lessons]) => {
      if (!who) return;
      const byKey = {};
      lessons.forEach(l => { (byKey[l.day + '|' + l.lesson_num] ??= []).push(l); });
      Object.values(byKey).forEach(group => {
        const classes = [...new Set(group.map(l => l.class).filter(Boolean))];
        if (classes.length > 1) {
          result.push({ who, day: group[0].day, lessonNum: group[0].lesson_num || 0, items: group });
        }
      });
    });
    result.sort((a, b) => dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day) || a.lessonNum - b.lessonNum);
    return result;
  }
  return {
    teacherConflicts: groupConflicts(scheduleData.teachers),
    roomConflicts: groupConflicts(scheduleData.rooms)
  };
}

function renderAdminTab() {
  const panel = document.getElementById('panel-admin');
  if (!panel) return;
  const { teacherConflicts, roomConflicts } = findScheduleConflicts();

  function renderGroup(title, list) {
    if (!list.length) return `<div class="empty">${esc(title)}: конфликтов не найдено</div>`;
    let html = `<div class="day-title">${esc(title)} — найдено: ${list.length}</div>`;
    list.forEach(c => {
      const details = c.items.map(l =>
        `${xlink('class', l.class, l.class || '?')} — ${esc(l.subject || '?')} (${xlink('teacher', l.teacher, l.teacher || 'не указан')}, каб. ${xlink('room', l.room, l.room || '?')})`
      ).join('<br>');
      html += `<div class="slot busy conflict"><div class="slot-row"><span class="slot-main"><b>${esc(c.who)}</b> — ${cap(c.day)}, ${c.lessonNum} урок</span><span class="slot-time">${esc(timeText(c.lessonNum))}</span></div><div class="lesson-sub">${details}</div></div>`;
    });
    return html;
  }

  panel.innerHTML = `
    <div style="font-size:20px;font-weight:700;margin-bottom:8px">🛠 Проверка расписания</div>
    <p style="color:var(--muted);font-size:13px;margin:-4px 0 14px">
      Эта вкладка скрыта от обычных пользователей и предназначена только для проверки корректности файла расписания.
      Обратите внимание: большие общие пространства (спортзалы, актовый зал) часто по школьной практике легитимно
      делят несколько классов одновременно — такие случаи в списке кабинетов не обязательно являются реальной ошибкой.
    </p>
    ${renderGroup('👨\u200d🏫 Конфликты учителей (один педагог в разных классах в одно время)', teacherConflicts)}
    <hr class="divider">
    ${renderGroup('🚪 Конфликты кабинетов (разные классы в одном кабинете в одно время)', roomConflicts)}
  `;
}

/* =========================================================
   3а0. ИЗБРАННОЕ + БЫСТРЫЕ ПЕРЕХОДЫ МЕЖДУ ВКЛАДКАМИ
   ========================================================= */
/* Избранное — это просто список {type, name} (учитель/класс/кабинет),
   хранится в localStorage: данные крошечные (строки), в отличие от самого
   Excel-файла, для которого используется IndexedDB. Хранилище отдельное
   и не зависит от версии кэша (CACHE_VERSION) — переживает любые
   обновления приложения. */
const FAVORITES_KEY = 'raspisanie547-favorites';
const FAV_ICON = { teacher: '👨\u200d🏫', class: '👥', room: '🚪' };
const FAV_TAB = { teacher: 'teachers', class: 'classes', room: 'rooms' };
const FAV_SELECT_ID = { teacher: 'teacherSelect', class: 'classSelect', room: 'roomSelect' };

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); }
  catch (err) { return []; }
}
function isFavorite(type, name) {
  return getFavorites().some(f => f.type === type && f.name === name);
}
function setFavorite(type, name, value) {
  const list = getFavorites().filter(f => !(f.type === type && f.name === name));
  if (value) list.push({ type, name });
  try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); }
  catch (err) { console.warn('Не удалось сохранить избранное:', err); }
}

/* Лента избранного — всегда над вкладками (см. renderMain). */
function renderFavoritesStrip() {
  const el = document.getElementById('favoritesStrip');
  if (!el) return;
  const favs = getFavorites();
  if (!favs.length) { el.innerHTML = ''; return; }
  el.innerHTML = favs.map(f => `
    <span class="fav-chip" data-type="${esc(f.type)}" data-name="${esc(f.name)}">
      ${FAV_ICON[f.type] || ''} ${esc(f.name)}
      <span class="fav-remove" data-type="${esc(f.type)}" data-name="${esc(f.name)}" title="Убрать из избранного">✕</span>
    </span>
  `).join('');
}

/* Переключает активную вкладку (та же логика, что и клик по кнопке вкладки —
   вынесена в отдельную функцию, чтобы вызывать её и программно). */
function activateTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tabId));
}

/* Переход к расписанию конкретного учителя/класса/кабинета — используется
   и кликом по ссылке внутри расписания, и кликом по чипу избранного. */
function goTo(type, name) {
  const tabId = FAV_TAB[type];
  const selectId = FAV_SELECT_ID[type];
  if (!tabId || !selectId) return;
  activateTab(tabId);
  const select = document.getElementById(selectId);
  if (!select) return;
  const hasOption = Array.from(select.options).some(o => o.value === name);
  if (!hasOption) {
    // такого учителя/класса/кабинета нет в текущем файле (например, избранное
    // осталось от расписания за прошлый период) — просто открываем вкладку
    return;
  }
  select.value = name;
  select.dispatchEvent(new Event('change'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Один делегированный обработчик на всё приложение — работает даже после
   пересборки innerHTML вкладок (что происходит постоянно), т.к. навешан
   на неизменный корневой контейнер, а не на конкретные элементы списков. */
app.addEventListener('click', (e) => {
  const secretTap = e.target.closest('.secret-tap');
  if (secretTap) { registerSecretTap(); return; }

  const themeBtn = e.target.closest('.theme-toggle');
  if (themeBtn) { toggleTheme(); return; }

  const link = e.target.closest('.xlink');
  if (link) { goTo(link.dataset.type, link.dataset.name); return; }

  const remove = e.target.closest('.fav-remove');
  if (remove) {
    setFavorite(remove.dataset.type, remove.dataset.name, false);
    renderFavoritesStrip();
    return;
  }
  const chip = e.target.closest('.fav-chip');
  if (chip) { goTo(chip.dataset.type, chip.dataset.name); return; }

  const star = e.target.closest('.fav-toggle');
  if (star) {
    const nowFav = !isFavorite(star.dataset.type, star.dataset.name);
    setFavorite(star.dataset.type, star.dataset.name, nowFav);
    star.textContent = nowFav ? '★' : '☆';
    renderFavoritesStrip();
    return;
  }
});

/* =========================================================
   3а. ПАМЯТЬ О ПОСЛЕДНЕМ ФАЙЛЕ (IndexedDB)
   ========================================================= */
/* Расписание меняется редко, поэтому имеет смысл запоминать последний
   загруженный Excel-файл целиком (сами байты, а не разобранные данные) —
   при следующем запуске файл просто заново проходит через тот же парсер.
   Хранится через IndexedDB (а не localStorage), т.к. файл — это бинарные
   данные, и localStorage для такого не предназначен и заметно меньше по
   лимиту. Если IndexedDB недоступен (приватный режим, старый браузер) —
   приложение просто ведёт себя как раньше, без запоминания. */
const LAST_FILE_DB = 'raspisanie547-db';
const LAST_FILE_STORE = 'files';
const LAST_FILE_KEY = 'lastFile';

function openLastFileDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB недоступен в этом браузере')); return; }
    const req = indexedDB.open(LAST_FILE_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(LAST_FILE_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveLastFile(fileName, arrayBuffer) {
  try {
    const db = await openLastFileDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(LAST_FILE_STORE, 'readwrite');
      tx.objectStore(LAST_FILE_STORE).put({ fileName, buffer: arrayBuffer, savedAt: Date.now() }, LAST_FILE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.warn('Не удалось сохранить файл для следующего запуска:', err);
  }
}
async function loadLastFile() {
  try {
    const db = await openLastFileDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(LAST_FILE_STORE, 'readonly');
      const req = tx.objectStore(LAST_FILE_STORE).get(LAST_FILE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.warn('Не удалось прочитать сохранённый файл:', err);
    return null;
  }
}
async function clearLastFile() {
  try {
    const db = await openLastFileDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(LAST_FILE_STORE, 'readwrite');
      tx.objectStore(LAST_FILE_STORE).delete(LAST_FILE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) { /* тихо игнорируем — нечего чистить или хранилище недоступно */ }
}

/* Общая логика разбора книги — используется и при выборе нового файла,
   и при повторном открытии сохранённого (без повторного чтения с диска). */
function loadScheduleFromArrayBuffer(arrayBuffer, fileName) {
  // Отключаем разбор того, что приложению не нужно (формулы, оформление,
  // rich-text, VBA-макросы, метаданные книги) — на слабых Android-устройствах
  // с маленьким лимитом памяти WebView это заметно снижает пиковое
  // потребление памяти при чтении файла.
  const wb = XLSX.read(arrayBuffer, {
    type: 'array',
    dense: true,        // компактное хранение ячеек вместо объекта со множеством ключей
    cellFormula: false,
    cellHTML: false,
    cellStyles: false,
    cellNF: false,
    cellText: false,
    sheetStubs: false,
    bookVBA: false,
    bookFiles: false,
    bookProps: false,
    bookDeps: false
  });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
  // Объединённые ячейки (например, номер урока на 4 строки при потоковом
  // делении) нужны парсеру, чтобы верно определять границы блока урока —
  // см. mergedRowSpanEnd() и комментарий в processLessonBlock().
  const merges = sheet['!merges'] || [];
  scheduleData = parseSchedule(rows, merges);
  currentFileName = fileName;
  console.log('Найдено классов:', Object.keys(scheduleData.classes).length);
  renderMain();
}

/* Общая обработка файла — используется и при выборе через кнопку,
   и при перетаскивании файла в окно (см. setupDragAndDrop). */
function handleIncomingFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      loadScheduleFromArrayBuffer(evt.target.result, file.name);
      saveLastFile(file.name, evt.target.result); // фоново запоминаем для следующего запуска
    } catch (err) {
      console.error(err);
      renderInitial('Ошибка: ' + err.message, 'error');
    }
  };
  reader.onerror = () => renderInitial('Не удалось прочитать файл', 'error');
  reader.readAsArrayBuffer(file);
}
function onFileSelected(e) {
  handleIncomingFile(e.target.files[0]);
}

/* ---------- Drag-and-drop ----------
   Работает на всё окно приложения, независимо от того, какой экран сейчас
   показан (начальный или основной) — файл можно перетащить в любой момент,
   он заменит текущее расписание, как и обычная загрузка через кнопку. */
function setupDragAndDrop() {
  let dragDepth = 0; // счётчик вложенных dragenter/dragleave — иначе overlay мигает при заходе на дочерние элементы
  const overlay = document.createElement('div');
  overlay.id = 'dropOverlay';
  overlay.className = 'drop-overlay';
  overlay.innerHTML = '<div class="drop-overlay-box">📁 Отпустите файл, чтобы загрузить расписание</div>';
  document.body.appendChild(overlay);

  const isFileDrag = (e) => Array.from(e.dataTransfer?.types || []).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth++;
    overlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault(); // обязательно, иначе браузер откроет файл вместо drop-события
  });
  window.addEventListener('dragleave', (e) => {
    if (!isFileDrag(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) overlay.classList.remove('active');
  });
  window.addEventListener('drop', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove('active');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    if (!/\.(xlsx|xls)$/i.test(file.name)) {
      renderInitial('Перетащенный файл должен быть в формате .xlsx или .xls', 'error');
      return;
    }
    handleIncomingFile(file);
  });
}

/* ---------- Вкладка «Учителя» ---------- */
function renderTeachersTab() {
  const panel = document.getElementById('panel-teachers');
  const teachers = Object.keys(scheduleData.teachers).filter(t => t && t.trim()).sort();
  if (!teachers.length) { panel.innerHTML = `<div class="empty">Нет данных об учителях</div>`; return; }

  panel.innerHTML = `
    <div class="row">
      <select id="teacherSelect">
        <option value="">Выберите учителя</option>
        ${teachers.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
      </select>
    </div>
    <hr class="divider">
    <div id="teacherSchedule" class="schedule-list"></div>
  `;
  document.getElementById('teacherSelect').addEventListener('change', (e) => {
    const el = document.getElementById('teacherSchedule');
    const teacher = e.target.value;
    if (!teacher) { el.innerHTML = ''; return; }
    const lessons = scheduleData.teachers[teacher] || [];
    const starIcon = isFavorite('teacher', teacher) ? '★' : '☆';
    let html = `<div style="font-size:20px;font-weight:700;margin-bottom:8px">Расписание: ${esc(teacher)}<span class="fav-toggle" data-type="teacher" data-name="${esc(teacher)}" title="Добавить/убрать из избранного">${starIcon}</span></div>`;
    if (!lessons.length) { html += `<div class="empty">У учителя нет уроков</div>`; }
    else {
      const byDay = {};
      lessons.forEach(l => { (byDay[l.day] ??= []).push(l); });
      dayOrder.forEach(day => {
        if (!byDay[day] || !byDay[day].length) return;
        const byNum = {};
        byDay[day].forEach(l => { byNum[l.lesson_num || 0] = l; });
        const dayMax = Math.max(...byDay[day].map(l => l.lesson_num || 0));
        html += `<div class="day-title">${cap(day)}:</div>`;
        for (let num = 1; num <= dayMax; num++) {
          const l = byNum[num];
          if (l) {
            html += `<div class="slot busy" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: ${xlink('class', l.class, l.class||'?')} - ${esc(l.subject||'?')} (каб. ${xlink('room', l.room, l.room||'?')})</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
          } else {
            html += `<div class="slot free" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: Окно</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
          }
        }
      });
    }
    el.innerHTML = html;
    applyTimeHighlight();
  });
}

/* ---------- Вкладка «Классы» + экспорт в PNG ---------- */
function renderClassesTab() {
  const panel = document.getElementById('panel-classes');
  const classes = Object.keys(scheduleData.classes).sort();
  if (!classes.length) { panel.innerHTML = `<div class="empty">Нет данных о классах</div>`; return; }

  panel.innerHTML = `
    <div class="row">
      <select id="classSelect">
        <option value="">Выберите класс</option>
        ${classes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
      </select>
      <button class="btn secondary" id="exportBtn" disabled>💾 Сохранить как изображение</button>
    </div>
    <hr class="divider">
    <div id="classSchedule" class="schedule-list"></div>
  `;

  const select = document.getElementById('classSelect');
  const exportBtn = document.getElementById('exportBtn');

  select.addEventListener('change', () => {
    const el = document.getElementById('classSchedule');
    const className = select.value;
    exportBtn.disabled = !className;
    if (!className) { el.innerHTML = ''; return; }

    const classSchedule = scheduleData.classes[className] || {};
    const starIcon = isFavorite('class', className) ? '★' : '☆';
    let html = `<div style="font-size:20px;font-weight:700;margin-bottom:8px">Расписание класса: ${esc(className)}<span class="fav-toggle" data-type="class" data-name="${esc(className)}" title="Добавить/убрать из избранного">${starIcon}</span></div>`;

    dayOrder.forEach(day => {
      const dayLessons = classSchedule[day];
      if (!dayLessons || !Object.keys(dayLessons).length) return;
      html += `<div class="day-title">${cap(day)}:</div>`;
      const dayMax = Math.max(...Object.keys(dayLessons).map(Number));
      for (let num = 1; num <= dayMax; num++) {
        const lessons = dayLessons[num];
        if (!lessons || !lessons.length) {
          html += `<div class="slot free" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: Окно</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
          continue;
        }
        const bySubject = {};
        lessons.forEach(l => { (bySubject[l.subject||'?'] ??= []).push(l); });
        const subjectEntries = Object.entries(bySubject);
        if (subjectEntries.length === 1 && subjectEntries[0][1].length === 1) {
          const l = subjectEntries[0][1][0];
          html += `<div class="slot busy" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: ${esc(subjectEntries[0][0])} - ${xlink('teacher', l.teacher, l.teacher||'не указан')} (каб. ${xlink('room', l.room, l.room||'?')})</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
        } else {
          // Поток делится на несколько групп — все группы рисуются ВНУТРИ
          // одного цветного блока урока, а не рядом с ним (раньше уходили
          // за его границы и выглядели оторванными от заголовка урока).
          // Название предмета всегда стоит рядом с номером урока на одной
          // строке — если предмет для всех групп один и тот же, ниже просто
          // список «педагог (кабинет)» без повторения названия; если группы
          // занимаются разными предметами — название повторяется у каждой
          // строки, чтобы было понятно, какой педагог что ведёт.
          const sameSubjectForAll = subjectEntries.length === 1;
          const headerText = sameSubjectForAll
            ? subjectEntries[0][0]
            : subjectEntries.map(([subject]) => subject).join(' / ');
          let groupsHtml = '';
          subjectEntries.forEach(([subject, subjLessons]) => {
            if (subjLessons.length > 1) {
              const parts = subjLessons.map(l => `${xlink('teacher', l.teacher, l.teacher||'не указан')} (каб. ${xlink('room', l.room, l.room||'?')})`);
              groupsHtml += `<div class="lesson-sub">${parts.join(' | ')}</div>`;
            } else {
              const l = subjLessons[0];
              const prefix = sameSubjectForAll ? '' : `${esc(subject)} - `;
              groupsHtml += `<div class="lesson-sub">${prefix}${xlink('teacher', l.teacher, l.teacher||'не указан')} (каб. ${xlink('room', l.room, l.room||'?')})</div>`;
            }
          });
          html += `<div class="slot busy" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: ${esc(headerText)}</span><span class="slot-time">${esc(timeText(num))}</span></div>${groupsHtml}</div>`;
        }
      }
    });
    el.innerHTML = html;
    applyTimeHighlight();
  });

  exportBtn.addEventListener('click', () => {
    const className = select.value;
    if (!className) return;
    exportBtn.disabled = true;
    const oldText = exportBtn.textContent;
    exportBtn.textContent = 'Сохраняем...';
    setTimeout(() => {
      try {
        exportClassScheduleToImage(className, scheduleData.classes[className]);
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = oldText;
      }
    }, 30);
  });
}

/* Портировано из schedule_exporter.py: PIL -> Canvas */
function exportClassScheduleToImage(className, schedule) {
  const dayCellWidth = 220, lessonCellWidth = 60, cellHeight = 90, headerHeight = 70, margin = 30;

  let maxLessons = 0;
  dayOrder.forEach(day => {
    const dayLessons = schedule[day];
    if (dayLessons) {
      const nums = Object.keys(dayLessons).map(Number);
      if (nums.length) maxLessons = Math.max(maxLessons, ...nums);
    }
  });
  if (maxLessons === 0) maxLessons = 10;

  const height = Math.max(600, Math.min(200 + maxLessons * 90, 2000));
  const width = margin + lessonCellWidth + dayOrder.length * dayCellWidth + margin;

  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
  ctx.textBaseline = 'top';

  const fontFamily = "'Segoe UI', Tahoma, Arial, sans-serif";

  // Заголовок
  ctx.fillStyle = '#000';
  ctx.font = `bold 26px ${fontFamily}`;
  const title = `Расписание класса: ${className}`;
  const titleWidth = ctx.measureText(title).width;
  ctx.fillText(title, (width - titleWidth) / 2, margin);

  // Заголовок столбца "Урок"
  const headerY = margin + headerHeight;
  ctx.fillStyle = '#e8f4f8';
  ctx.fillRect(margin, headerY, lessonCellWidth, cellHeight);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeRect(margin, headerY, lessonCellWidth, cellHeight);
  ctx.fillStyle = '#000';
  ctx.font = `bold 15px ${fontFamily}`;
  ctx.fillText('Урок', margin + 10, headerY + 10);

  // Заголовки дней
  dayOrder.forEach((day, i) => {
    const x = margin + lessonCellWidth + i * dayCellWidth;
    ctx.fillStyle = '#e8f4f8';
    ctx.fillRect(x, headerY, dayCellWidth, cellHeight);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(x, headerY, dayCellWidth, cellHeight);
    ctx.fillStyle = '#000';
    ctx.font = `bold 15px ${fontFamily}`;
    const dayText = cap(day);
    const tw = ctx.measureText(dayText).width;
    ctx.fillText(dayText, x + (dayCellWidth - tw) / 2, headerY + (cellHeight - 16) / 2);
  });

  // Тело таблицы
  for (let lessonNum = 1; lessonNum <= maxLessons; lessonNum++) {
    const y = headerY + lessonNum * cellHeight;

    ctx.fillStyle = '#f9f9f9';
    ctx.fillRect(margin, y, lessonCellWidth, cellHeight);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.strokeRect(margin, y, lessonCellWidth, cellHeight);
    ctx.fillStyle = 'darkblue';
    ctx.font = `bold 14px ${fontFamily}`;
    const numText = String(lessonNum);
    const numWidth = ctx.measureText(numText).width;
    ctx.fillText(numText, margin + (lessonCellWidth - numWidth) / 2, y + (cellHeight - 14) / 2);

    dayOrder.forEach((day, i) => {
      const x = margin + lessonCellWidth + i * dayCellWidth;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.strokeRect(x, y, dayCellWidth, cellHeight);

      const lessons = schedule[day] && schedule[day][lessonNum];
      if (lessons && lessons.length) {
        const n = lessons.length;
        if (n > 1) {
          for (let idx = 1; idx < n; idx++) {
            const splitY = y + Math.floor((idx * cellHeight) / n);
            ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, splitY); ctx.lineTo(x + dayCellWidth, splitY); ctx.stroke();
          }
          lessons.forEach((lesson, idx) => {
            const sectionH = cellHeight / n;
            const sy = y + idx * sectionH;
            let subject = lesson.subject || '?';
            let teacher = lesson.teacher || 'не указан';
            const room = lesson.room || '?';
            if (subject.length > 12) subject = subject.slice(0, 12) + '...';
            if (teacher.length > 15) teacher = teacher.slice(0, 15) + '...';
            const fontSize = n > 2 ? 10 : 12;
            ctx.font = `${fontSize}px ${fontFamily}`;
            ctx.fillStyle = 'darkblue'; ctx.fillText(subject, x + 3, sy + 2);
            ctx.fillStyle = 'darkgreen'; ctx.fillText(teacher, x + 3, sy + sectionH/3);
            if (room && room !== '?') { ctx.fillStyle = 'darkred'; ctx.fillText('к.' + room, x + 3, sy + 2*sectionH/3); }
          });
        } else {
          const lesson = lessons[0];
          let subject = lesson.subject || '?';
          let teacher = lesson.teacher || 'не указан';
          const room = lesson.room || '?';
          if (subject.length > 15) subject = subject.slice(0, 15) + '...';
          if (teacher.length > 18) teacher = teacher.slice(0, 18) + '...';
          ctx.font = `13px ${fontFamily}`;
          ctx.fillStyle = 'darkblue'; ctx.fillText(subject, x + 5, y + 5);
          if (teacher !== 'не указан') { ctx.fillStyle = 'darkgreen'; ctx.fillText(teacher, x + 5, y + 25); }
          if (room && room !== '?') { ctx.fillStyle = 'darkred'; ctx.fillText('каб. ' + room, x + 5, y + 45); }
        }
      } else {
        ctx.font = `13px ${fontFamily}`;
        ctx.fillStyle = 'gray';
        const emptyWidth = ctx.measureText('---').width;
        ctx.fillText('---', x + (dayCellWidth - emptyWidth) / 2, y + (cellHeight - 13) / 2);
      }
    });
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `расписание_${className}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

/* ---------- Вкладка «Кабинеты» ---------- */
function renderRoomsTab() {
  const panel = document.getElementById('panel-rooms');
  const rooms = Object.keys(scheduleData.rooms)
    .filter(r => r && r.trim())
    .sort((a, b) => a.length - b.length || a.localeCompare(b));
  if (!rooms.length) { panel.innerHTML = `<div class="empty">Нет данных о кабинетах</div>`; return; }

  panel.innerHTML = `
    <div class="row">
      <select id="roomSelect">
        <option value="">Выберите кабинет</option>
        ${rooms.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}
      </select>
    </div>
    <hr class="divider">
    <div id="roomSchedule" class="schedule-list"></div>
  `;

  document.getElementById('roomSelect').addEventListener('change', (e) => {
    const el = document.getElementById('roomSchedule');
    const room = e.target.value;
    if (!room) { el.innerHTML = ''; return; }

    const roomLessons = scheduleData.rooms[room] || [];
    const starIcon = isFavorite('room', room) ? '★' : '☆';
    let html = `<div style="font-size:20px;font-weight:700;margin-bottom:8px">Расписание кабинета: ${esc(room)}<span class="fav-toggle" data-type="room" data-name="${esc(room)}" title="Добавить/убрать из избранного">${starIcon}</span></div>`;

    if (!roomLessons.length) {
      html += `<div class="empty">В кабинете нет занятий</div>`;
      el.innerHTML = html;
      return;
    }

    const byDay = {};
    roomLessons.forEach(l => { (byDay[l.day] ??= []).push(l); });

    dayOrder.forEach(day => {
      if (!byDay[day] || !byDay[day].length) return;
      const byNum = {};
      byDay[day].forEach(l => { byNum[l.lesson_num || 0] = l; });
      const dayMax = Math.max(...byDay[day].map(l => l.lesson_num || 0));

      html += `<div class="day-title">${cap(day)}:</div>`;
      for (let num = 1; num <= dayMax; num++) {
        if (byNum[num]) {
          const l = byNum[num];
          html += `<div class="slot busy" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: ${esc(l.subject||'?')} - ${xlink('teacher', l.teacher, l.teacher||'не указан')} (класс: ${xlink('class', l.class, l.class||'?')})</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
        } else {
          html += `<div class="slot free" data-day="${esc(day)}" data-lesson="${num}"><div class="slot-row"><span class="slot-main">${num} урок: Кабинет свободен</span><span class="slot-time">${esc(timeText(num))}</span></div></div>`;
        }
      }
    });

    // Свободные уроки считаем от реальной длины учебного дня (10 уроков —
    // столько же строк в таблице времени LESSON_TIMES), а не от того, до
    // какого номера урока этот конкретный кабинет случайно использовался —
    // иначе кабинет, занятый только по 3-й урок каждый день, показывал бы
    // "0 свободных", хотя на деле свободен с 4-го по 10-й все дни.
    const LESSONS_PER_DAY = Object.keys(LESSON_TIMES).length;
    const totalLessons = roomLessons.length;
    const freeLessons = LESSONS_PER_DAY * dayOrder.length - totalLessons;
    html += `<div class="room-stats">Статистика: занято уроков — ${totalLessons}, свободно — ${freeLessons}</div>`;

    el.innerHTML = html;
    applyTimeHighlight();
  });
}

/* ---------- Вспомогательное: параллели и предметы из уроков учителей ---------- */
function extractGrade(className) {
  const m = String(className || '').match(/^(\d+)/);
  return m ? m[1] : null;
}

    if (!dayEl.value || !lessonEl.value) return;

    const selectedGrade = gradeEl.value;

      if (lessons.some(l => l.day === day && l.lesson_num === lessonNum)) busy.add(teacher);

    let free = allTeachers.filter(t => !busy.has(t));

    if (selectedSubject && selectedSubject !== 'Все предметы') {
      free = free.filter(t => (scheduleData.teachers[t] || []).some(l => l.subject === selectedSubject));
    }
    if (selectedGrade && selectedGrade !== 'Все параллели') {
      const re = new RegExp('^' + selectedGrade + '[а-я]?$');

            <div style="font-size:12.5px">• Предметы: ${subjects.length ? esc(subjects.join(', ')) : 'нет предметов'}</div>
          </div>`;
      });
    }
    resultsEl.innerHTML = html;
  }

  document.getElementById('tsSearchBtn').addEventListener('click', searchTeachers);
  document.getElementById('tsClearBtn').addEventListener('click', () => {
    subjectEl.value = 'Все предметы';
    gradeEl.value = 'Все параллели';
    searchTeachers();
  });
  [dayEl, lessonEl, subjectEl, gradeEl].forEach(el => el.addEventListener('change', searchTeachers));
}

/* Регистрация service worker'а — даёт офлайн-работу и возможность
   установить приложение на Android («Добавить на главный экран»).
   Работает только при открытии по https:// или localhost — если файл
   открыт напрямую (file://), эта часть просто ничего не делает и не
   мешает обычной работе приложения в браузере на компьютере. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    // Если на странице уже ЕСТЬ активный service worker — значит, это не
    // самая первая установка, а повторный визит. В этом случае, если
    // браузер найдёт и активирует более новую версию service worker'а,
    // страницу нужно перезагрузить один раз, чтобы новый код вступил в
    // силу сразу — иначе открытая вкладка молча продолжит работать
    // по старому коду до ручного закрытия и повторного открытия.
    const hadControllerBefore = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then((registration) => {
      if (hadControllerBefore) {
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      }
      const checkForUpdate = () => registration.update().catch(() => {});

      // Проверяем сразу при открытии...
      checkForUpdate();

      // ...и каждый раз, когда приложение возвращается на передний план —
      // это главный случай: открытие иконки уже установленного PWA часто
      // просто «будит» существующую вкладку в фоне, а не загружает страницу
      // заново, поэтому обычная проверка при загрузке страницы не сработает.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForUpdate();
      });

      // На случай, если приложение остаётся открытым подолгу без сворачивания —
      // дополнительно проверяем раз в час.
      setInterval(checkForUpdate, 60 * 60 * 1000);
    }).catch((err) => {
      console.warn('Не удалось зарегистрировать service worker:', err);
    });
  });
}
</script>
</body>
</html>
